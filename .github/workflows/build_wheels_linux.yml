name: Build Linux Wheels

on:
  pull_request:
  push:
    branches:
      - nightly
      - main
      - release/*
    tags:
        # NOTE: Binary build pipelines should only get triggered on release candidate builds
        # Release candidate tags look like: v1.11.0-rc1
        - v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_type == 'branch' && github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  generate-matrix:
    uses: pytorch/test-infra/.github/workflows/generate_binary_build_matrix.yml@main
    with:
      package-type: wheel
      os: linux
      runner-fleet: osdc
      test-infra-repository: pytorch/test-infra
      test-infra-ref: main
      with-xpu: enable
      python-abi3: enable
  build:
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: pytorch/audio
            smoke-test-script: test/smoke_test/smoke_test_no_ffmpeg.py
            package-name: torchaudio
    name: ${{ matrix.repository }}
    uses: pytorch/test-infra/.github/workflows/build_wheels_linux.yml@main
    with:
      repository: ${{ matrix.repository }}
      ref: ""
      test-infra-repository: pytorch/test-infra
      test-infra-ref: main
      build-matrix: ${{ needs.generate-matrix.outputs.matrix }}
      smoke-test-script: ${{ matrix.smoke-test-script }}
      package-name: ${{ matrix.package-name }}
      trigger-event: ${{ github.event_name }}
    secrets:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  # The build job only ever installs the wheel back into the interpreter that built
  # it, so it cannot catch an abi3 wheel that fails to load on a newer CPython.
  # This is the platform we sweep the full version range on; the others only check
  # the newest version, which is the one the build interpreter is furthest from.
  test-abi3-wheel:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Starts at the build interpreter: a cp311-abi3 wheel is not installable
        # on anything older (see packaging.tags._abi3_applies).
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    name: test-abi3-wheel-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/test-abi3-wheel
        with:
          python-version: ${{ matrix.python-version }}
          # The build job names its artifact after the interpreter it built with.
          # For an abi3 wheel that is the oldest stable interpreter in test-infra's
          # nightly matrix (PYTHON_ARCHES_DICT["nightly"][0]); keep this in step with
          # it. A mismatch makes download-artifact match nothing and still exit 0.
          artifact-pattern: "*_3.11_cpu_x86_64"
          wheel-glob: "dist/torchaudio-*-abi3-manylinux*_x86_64.whl"
